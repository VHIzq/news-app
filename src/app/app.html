<h1>Noticias</h1>

<section>
  <h2>Agregar noticia</h2>
  <form (ngSubmit)="agregar()">
    <input name="titulo" placeholder="Título" [(ngModel)]="noticia.titulo" required />
    <textarea
      name="contenido"
      placeholder="Contenido"
      [(ngModel)]="noticia.contenido"
      required
    ></textarea>
    <input
      name="imagenUrl"
      placeholder="URL de la imagen"
      [(ngModel)]="noticia.imagenUrl"
      required
    />
    <input name="autor" placeholder="Autor" [(ngModel)]="noticia.autor" required />
    <button type="submit">Agregar</button>
  </form>
</section>

<section>
  <h2>Editar noticia</h2>
  <form (ngSubmit)="editar()">
    <input
      name="id"
      type="number"
      placeholder="Id de la noticia"
      [(ngModel)]="edicionId"
      required
    />
    <input name="titulo" placeholder="Título" [(ngModel)]="edicion.titulo" required />
    <textarea
      name="contenido"
      placeholder="Contenido"
      [(ngModel)]="edicion.contenido"
      required
    ></textarea>
    <input
      name="imagenUrl"
      placeholder="URL de la imagen"
      [(ngModel)]="edicion.imagenUrl"
      required
    />
    <input name="autor" placeholder="Autor" [(ngModel)]="edicion.autor" required />
    <button type="submit">Editar</button>
  </form>
</section>

<section>
  <h2>Eliminar noticia</h2>
  <form (ngSubmit)="eliminar()">
    <input
      name="id"
      type="number"
      placeholder="Id de la noticia"
      [(ngModel)]="eliminacionId"
      required
    />
    <button type="submit">Eliminar</button>
  </form>
</section>

@if (mensaje()) {
  <p role="status">{{ mensaje() }}</p>
}

<section>
  <h2>Arreglo de noticias (JSON)</h2>
  <pre>{{ json() }}</pre>
</section>

<router-outlet />
